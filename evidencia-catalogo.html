<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Oficial BTS</title>
    <link rel="stylesheet" href="evidencia-catalogo.css">
</head>
<body>

    <h1 class="titulo-seccion">BTS Official Catalog</h1>

    <div class="catalogo_container">

        <figure class="catalogo_card">
            <div class="img_wrapper">
                <img class="catalogo_img" src="army_bomb-4.jpeg" alt="ARMY Bomb Light Stick">
            </div>
            <h3>ARMY Bomb Light Stick (Ver. 4)</h3>
            <p>$280.000 COP</p>
        </figure>

        <figure class="catalogo_card">
            <div class="img_wrapper">
                <img class="catalogo_img" src="album_love_yourself.jpeg" alt="Álbum Love Yourself">
            </div>
            <h3>Álbum 'Love Yourself: Answer'</h3>
            <p>$165.000 COP</p>
        </figure>

        <figure class="catalogo_card">
            <div class="img_wrapper">
                <img class="catalogo_img" src="BTS_Mic_Drop_Photo_Card.jpeg" alt="BTS Photocards Set">
            </div>
            <h3>BTS 'Mic Drop' Photo Card Set</h3>
            <p>$45.000 COP</p>
        </figure>

        <figure class="catalogo_card">
            <div class="img_wrapper">
                <img class="catalogo_img" src="Hoodie_Yet_to_come.jpg" alt="Hoodie Oficial BTS">
            </div>
            <h3>Hoodie Oficial Tour 'Yet To Come'</h3>
            <p>$320.000 COP</p>
        </figure>

        <figure class="catalogo_card">
            <div class="img_wrapper">
                <img class="catalogo_img" src="peluches_BT21.jpeg" alt="Colección Peluches BT21">
            </div>
            <h3>Colección Peluches BT21</h3>
            <p>$95.000 COP</p>
        </figure>

        <figure class="catalogo_card">
            <div class="img_wrapper">
                <img class="catalogo_img" src="BTS_Specialized_Tour_Book.jpeg" alt="BTS Specialized Tour Book">
            </div>
            <h3>BTS Specialized Tour Book</h3>
            <p>$140.000 COP</p>
        </figure>

    </div>

</body>
</html>
